# Done to increase the memory available to gradle.
# Kanka, Gradle rahat çalışsın diye burayı 4GB yaptık (RAM durumuna göre 3G veya 2G de yapabilirsin)
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
# Burayı bizim projeye göre güncelledim kanka
mod_version=1.0.0
maven_group=com.viamercatorum
archives_base_name=viamercatorum

# Dependencies
fabric_api_version=0.150.0+26.1.2
